[package]
name = "bide"
version = "0.1.0"
description = "Agent IDE on Tauri 2 + omp RPC"
authors = ["wspeirs"]
edition = "2021"

[lib]
name = "bide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
